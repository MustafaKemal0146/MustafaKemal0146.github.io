<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Mustafa Kemal Çıngıl</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:#FAF9F5;color:#141413;font:400 17px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px;
    background-image:radial-gradient(#D9D5C9 1.3px,transparent 1.5px);background-size:30px 30px}
  main{max-width:520px;background:#FAF9F5;padding:8px}
  .code{font:500 13px "JetBrains Mono",ui-monospace,monospace;color:#6B6A64;display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .code i{width:7px;height:7px;border-radius:50%;background:#D97757;box-shadow:0 0 0 4px rgba(217,119,87,.15)}
  h1{font:600 clamp(40px,8vw,64px)/1 -apple-system,"Inter",sans-serif;letter-spacing:-0.05em}
  h1 em{font:italic 400 1em "Source Serif 4",Georgia,serif;color:#B5583A;letter-spacing:-0.01em}
  p{color:#6B6A64;margin:20px 0 28px}
  a.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;background:#141413;color:#FAF9F5;text-decoration:none;font-weight:500;font-size:15px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
  a.btn:hover{transform:translateX(3px)}
  a.btn:focus-visible{outline:2px solid #D97757;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code"><i></i> ENOENT · 404</div>
  <h1>Bu sayfa <em>yok.</em></h1>
  <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfada projelerime, açık kaynak katkılarıma ve iletişim bilgilerime ulaşabilirsin.</p>
  <a class="btn" href="/">Ana sayfaya dön <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
